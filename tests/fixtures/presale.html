<!doctype html>
<html lang="en-GB">
  <head>
    <title>Buy cinema tickets for The Odyssey | BFI IMAX</title>
    <meta charset="utf-8" />
  </head>
  <body>
    <main>
      <h1>The Odyssey</h1>
      <div class="Booking Booking--compact">
        <form action="seatSelect.asp" method="post">
          <div class="detailed-search-results results-box">
            <div class="odd result-box-item">
              <div class="item-description result-box-item-details">
                <div class="item-start-date">
                  <span class="start-date">Friday 17 July 2026 00:01</span>
                </div>
                <div class="item-venue">BFI IMAX</div>
              </div>
              <div
                class="item-link result-box-item-details last-column soldout"
              >
                <span class="unavailable-message">Sold out!</span>
              </div>
            </div>
            <div class="even result-box-item">
              <div class="item-description result-box-item-details">
                <div class="item-start-date">
                  <span class="start-date">Friday 17 July 2026 16:15</span>
                </div>
              </div>
              <div
                class="item-link result-box-item-details last-column next-on-sale"
              >
                <a class="btn btn-secondary" href="default.asp?article=odyssey"
                  >The Odyssey</a
                >
                <span class="on-sale-date"
                  >On sale Monday 15 June 2026 09:00</span
                >
              </div>
            </div>
            <div class="odd result-box-item">
              <div class="item-description result-box-item-details">
                <div class="item-start-date">
                  <span class="start-date">Friday 17 July 2026 20:15</span>
                </div>
              </div>
              <div
                class="item-link result-box-item-details last-column next-on-sale"
              >
                <a class="btn btn-secondary" href="default.asp?article=odyssey"
                  >The Odyssey</a
                >
                <span class="on-sale-date"
                  >On sale Monday 15 June 2026 09:00</span
                >
              </div>
            </div>
          </div>
        </form>
      </div>
    </main>
  </body>
</html>
