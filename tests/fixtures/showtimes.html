<!doctype html>
<html lang="en-GB">
  <head>
    <title>Buy cinema tickets for The Odyssey | BFI IMAX</title>
    <meta charset="utf-8" />
  </head>
  <body>
    <main>
      <h1>The Odyssey (IMAX 70mm)</h1>
      <div class="Booking Booking--compact">
        <form action="seatSelect.asp" method="post">
          <div class="detailed-search-results results-box">
            <div class="odd result-box-item">
              <div class="item-description result-box-item-details">
                <div class="item-start-date">
                  <span class="start-date">Friday 17 July 2026 11:30</span>
                </div>
              </div>
              <div class="item-link result-box-item-details last-column good">
                <a
                  class="btn btn-primary"
                  aria-label="Buy, The Odyssey, Friday 17 July 2026 11:30"
                  href="seatSelect.asp?perf=1"
                  >Buy</a
                >
              </div>
            </div>
            <div class="even result-box-item">
              <div class="item-description result-box-item-details">
                <div class="item-start-date">
                  <span class="start-date">Friday 17 July 2026 20:15</span>
                </div>
              </div>
              <div
                class="item-link result-box-item-details last-column limited"
              >
                <a
                  class="btn btn-primary"
                  aria-label="Buy, The Odyssey, Friday 17 July 2026 20:15"
                  href="seatSelect.asp?perf=2"
                  >Buy</a
                >
              </div>
            </div>
            <div class="odd result-box-item">
              <div class="item-description result-box-item-details">
                <div class="item-start-date">
                  <span class="start-date">Saturday 18 July 2026 19:30</span>
                </div>
              </div>
              <div
                class="item-link result-box-item-details last-column soldout"
              >
                <span class="unavailable-message">Sold out!</span>
              </div>
            </div>
            <div class="even result-box-item">
              <div class="item-description result-box-item-details">
                <div class="item-start-date">
                  <span class="start-date">Sunday 19 July 2026 20:30</span>
                </div>
              </div>
              <div
                class="item-link result-box-item-details last-column excellent"
              >
                <a
                  class="btn btn-primary"
                  aria-label="Buy, The Odyssey, Sunday 19 July 2026 20:30"
                  href="seatSelect.asp?perf=3"
                  >Buy</a
                >
              </div>
            </div>
          </div>
        </form>
      </div>
    </main>
  </body>
</html>
